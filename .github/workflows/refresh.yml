name: Refresh forecast

on:
  schedule:
    # Off the top of the hour: GitHub delays or skips many jobs scheduled at :00.
    # 7:17 a.m., 12:17 p.m. and 7:17 p.m. Central Daylight Time (one hour earlier after Nov. 1)
    - cron: "17 12 * * *"
    - cron: "17 17 * * *"
    - cron: "17 0 * * *"
    # Election night, Nov 3 (Central Standard Time): every 10 minutes from 7 p.m. to 1 a.m. Central
    - cron: "3-59/10 1-7 4 11 *"
  workflow_dispatch:        # "Run workflow" button on GitHub
    inputs:
      override_sanity:
        description: "Publish even if the sanity checks flag a big change (only if you have checked it is real)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write           # save each day's data back to the repo
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # fetch -> model -> build -> 40+ regression tests; exits non-zero (and nothing is published) if any test fails
      - name: Refresh, test and sanity-check
        run: ./refresh.sh
        env:
          SANITY_OVERRIDE: ${{ inputs.override_sanity && '1' || '' }}

      - name: Save today's data
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
