name: Refresh forecast

on:
  schedule:
    # Off the top of the hour: GitHub delays or skips many jobs scheduled at :00.
    # 7:17 a.m., 12:17 p.m. and 7:17 p.m. Central Daylight Time (one hour earlier after Nov. 1)
    - cron: "17 12 * * *"
    - cron: "17 17 * * *"
    - cron: "17 0 * * *"
    # Early voting days (Oct 19-30): every 20 minutes, 8 a.m. to 10 p.m. Central, as counties post turnout
    - cron: "3,23,43 13-23 19-30 10 *"
    - cron: "3,23,43 0-3 20-31 10 *"
    # Election night, Nov 3 (Central Standard Time): every 10 minutes from 7 p.m. to 1 a.m. Central
    - cron: "3-59/10 1-7 4 11 *"
  workflow_dispatch:        # "Run workflow" button on GitHub
    inputs:
      override_sanity:
        description: "Publish even if the sanity checks flag a big change (only if you have checked it is real)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  actions: write            # start the heartbeat if it is not running
  contents: write           # save each day's data back to the repo
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # GitHub skips many scheduled runs. The heartbeat workflow starts refreshes itself; make sure it is running.
      - name: Start the heartbeat if it is not running
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          n=$(gh run list -w heartbeat.yml -L 10 --json status -q '[.[] | select(.status != "completed")] | length')
          if [ "${n:-0}" = "0" ]; then gh workflow run heartbeat.yml --ref main && echo "started heartbeat"; else echo "heartbeat already running"; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # fetch -> model -> build -> 40+ regression tests; exits non-zero (and nothing is published) if any test fails
      - name: Refresh, test and sanity-check
        run: ./refresh.sh
        env:
          SANITY_OVERRIDE: ${{ inputs.override_sanity && '1' || '' }}

      - name: Save today's data
        continue-on-error: true   # a failed save (another run pushed first) must not stop the site from publishing
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Data refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
          # the primary-layer job also commits; rebase onto it instead of failing the publish
          for i in 1 2 3; do git pull --rebase --autostash -q origin main && git push && exit 0; sleep 10; done
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
