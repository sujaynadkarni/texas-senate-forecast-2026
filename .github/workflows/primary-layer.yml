name: Primary layer

# Once each morning (started by the heartbeat around 9 a.m. Central): downloads the state's daily lists of early
# voters and of early/mail voters in the March 2026 primaries, and saves county totals only
# (data/primary_layer.json). Voter names and IDs stay in memory on GitHub's machine and are never saved.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primary-layer
  cancel-in-progress: false

jobs:
  primary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download voter lists and count by county
        run: PYTHONPATH=pipeline python pipeline/primary_layer.py
      - name: Save county totals
        run: |
          git config user.name "forecast-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/primary_layer.json
          git diff --cached --quiet && exit 0
          git commit -m "Primary layer $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 10; done
          exit 1
